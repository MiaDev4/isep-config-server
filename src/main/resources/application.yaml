spring:
  application:
    name: isep-config-server

  cloud:
    config:
      server:
        git:
          uri: ${DBE_REPOS:https://github.com/MiaDev4/dbe-cloud-server.git}
          refresh-rate: 0
          default-label: main
          clone-on-start: true

  profiles:
    active: dev
server:
  port: ${CFG_SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include:
         - refresh
         - metrics
         - health